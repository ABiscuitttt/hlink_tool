<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件硬链接工具</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>文件硬链接工具</h1>
            <p class="header-subtitle">双面板浏览 · WebSocket 实时创建硬链接</p>
        </header>

        <div class="panels-container">
            <!-- 左侧：源目录面板 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-header-flex">
                        <h2>源目录</h2>
                        <input class="path-display-input" id="src-path" type="text" data-type="src" value="/"
                            title="回车切换目录" autocomplete="off" spellcheck="false" />
                        <button class="btn btn-folder" id="src-new-folder-btn" title="新建文件夹">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
                                <path d="M12 11v6" />
                                <path d="M9 14h6" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="file-list" id="src-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>正在加载文件列表...</div>
                    </div>
                </div>
            </div>

            <!-- 右侧：目标目录面板 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-header-flex">
                        <h2>目标目录</h2>
                        <input class="path-display-input" id="dst-path" type="text" data-type="dst" value="/"
                            title="回车切换目录" autocomplete="off" spellcheck="false" />
                        <button class="btn btn-folder" id="dst-new-folder-btn" title="新建文件夹">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
                                <path d="M12 11v6" />
                                <path d="M9 14h6" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="file-list" id="dst-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>正在加载文件列表...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <div class="buttons">
                <button class="btn btn-secondary" id="refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                        <path d="M21 3v6h-6" />
                    </svg>
                    <span>刷新目录</span>
                </button>
                <button class="btn btn-primary" id="link-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                    </svg>
                    <span>创建硬链接</span>
                </button>
            </div>

            <div class="panel-actions">
                <div class="filter-control">
                    <input type="checkbox" id="filter-src" name="filter-src" />
                    <label for="filter-src">仅显示链接数为 1 的文件/文件夹</label>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-message" id="status-message">正在加载文件列表</div>
            <div class="kbd-hints">Ctrl+L 链接 · Ctrl 多选 · Esc 取消选择</div>
        </div>
    </div>

    <!-- 确认链接模态框 -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>确认链接</h3>
            </div>
            <div class="modal-body">
                <p class="modal-message" id="confirm-message"></p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancel-btn">取消</button>
                    <button class="btn btn-primary" id="confirm-btn">确认链接</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新建文件夹模态框 -->
    <div class="modal-overlay" id="new-folder-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>新建文件夹</h3>
            </div>
            <div class="modal-body">
                <p class="modal-message" id="new-folder-message">请输入新文件夹名称：</p>
                <input type="text" id="new-folder-input" class="folder-input" placeholder="文件夹名称" autocomplete="off"
                    spellcheck="false" />
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="new-folder-cancel-btn">取消</button>
                    <button class="btn btn-primary" id="new-folder-confirm-btn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
